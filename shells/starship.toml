add_newline = true
command_timeout = 200
format = '$hostname${custom.place}$directory([\[$git_branch$git_commit$git_status$git_state\]](blue) )$line_break$character'

[custom.place]
command = 'printf "%s" "${PLACE_PATH:-$PWD}"'
when = true
shell = ["sh"]
format = "[$output](blue) "

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bright-black"

[directory]
format = "[$read_only]($read_only_style)"
read_only = "ro "
read_only_style = "red"

[git_branch]
format = '[$branch]($style)'
style = "blue"
only_attached = true

[git_commit]
format = '[@$hash]($style)'
style = "yellow"
only_detached = true

[git_state]
format = ' [|$state( $progress_current/$progress_total)]($style)'
style = "bold yellow"

[git_status]
format = '( [$all_status$ahead_behind]($style))'
style = "yellow"
conflicted = "[=](bold red)"
staged = "[+](green)"
modified = "!"
renamed = "[»](cyan)"
deleted = "[✘](red)"
typechanged = "~"
untracked = "?"
stashed = ""
ahead = "[⇡](blue)"
behind = "⇣"
diverged = "⇕"
up_to_date = ""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"
