model:
  default: grok-4.6
  provider: xai-oauth
  base_url: https://api.x.ai/v1
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 150
  service_tier: ''
  fast_auto_seconds: 60
  verbose: false
  reasoning_effort: high
  personalities: {}
terminal:
  backend: local
  cwd: .
  font_family: Berkeley Mono Variable
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: nous
browser:
  inactivity_timeout: 120
  use_real_profile: true
  extension_control:
    enabled: false
  cloud_provider: nous
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: openai-codex
    model: gpt-5.6-terra
  compression:
    provider: openai-codex
    model: gpt-5.6-luna
  skills_hub:
    provider: openai-codex
    model: gpt-5.6-luna
  approval:
    provider: openai-codex
    model: gpt-5.6-terra
  review:
    provider: openai-codex
    model: gpt-5.6-luna
  mcp:
    provider: openai-codex
    model: gpt-5.6-luna
  title_generation:
    provider: openai-codex
    model: gpt-5.6-luna
  curator:
    provider: openai-codex
    model: gpt-5.6-luna
display:
  compact: false
  busy_input_mode: interrupt
  interface: tui
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
tts:
  provider: nous
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
  provider: nous
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  max_iterations: 250
  reasoning_effort: high
moa:
  presets:
    default:
      reference_models:
        - provider: openai-codex
          model: gpt-5.5
          enabled: true
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
          enabled: true
      enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openai-codex
      model: gpt-5.5
      enabled: true
    - provider: openrouter
      model: deepseek/deepseek-v4-pro
      enabled: true
  aggregator:
    provider: openrouter
    model: anthropic/claude-opus-4.8
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: false
skills:
  creation_nudge_interval: 15
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - baoyu-infographic
    - box
