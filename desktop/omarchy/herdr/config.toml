onboarding = false

# Retain Omarchy's tmux-compatible interaction model.
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane
[theme]
name = "terminal"

[theme.custom]
# Keep active-tab text readable against the terminal's blue accent.
panel_bg = "black"

[terminal]
new_cwd = "follow"
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+l"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = "prefix+ctrl+r"
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"
rename_pane = "prefix+shift+o"

# Tabs: keep Omarchy prefix/alt arrows, add browser-style cycle.
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left", "ctrl+shift+tab"]
next_tab = ["prefix+n", "alt+right", "ctrl+tab"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Workspaces: Omarchy arrows + ctrl+alt tab cycle + numbered jumps.
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up", "ctrl+alt+shift+tab"]
next_workspace = ["prefix+shift+n", "alt+down", "ctrl+alt+tab"]
switch_workspace = "ctrl+shift+1..9"

[ui]
accent = "yellow"
pane_borders = true
pane_gaps = true
pane_scrollbars = true
confirm_close = false
prompt_new_tab_name = false
mouse_capture = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
