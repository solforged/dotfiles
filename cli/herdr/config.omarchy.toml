onboarding = false

# Retain Omarchy's tmux-compatible interaction model.
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane
# BEGIN GENERATED RETICLE THEME
# Generated by desktop/reticle/generate.py; edit palettes.json instead.
[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[theme.custom]
accent = "yellow"
text = "reset"
subtext0 = "darkgray"
overlay0 = "darkgray"
overlay1 = "white"
mauve = "magenta"
green = "green"
yellow = "yellow"
red = "red"
blue = "blue"
teal = "cyan"
peach = "yellow"
sidebar_bg = "reset"
active_row_bg = "reset"
selection_bg = "reset"
surface0 = "reset"
surface1 = "reset"
# END GENERATED RETICLE THEME

[terminal]
new_cwd = "follow"
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = "prefix+ctrl+r"
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "yellow"
pane_borders = true
pane_gaps = false
pane_scrollbars = false
confirm_close = false
prompt_new_tab_name = false
mouse_capture = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
