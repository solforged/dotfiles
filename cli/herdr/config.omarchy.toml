onboarding = false

# Retain Omarchy's tmux-compatible interaction model.
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane
# GitHub default palettes; mode overrides follow the host terminal appearance.
# Source: primer/github-vscode-theme and @primer/primitives 7.10.0.
[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom]
accent = "#2f81f7"
text = "#e6edf3"
subtext0 = "#7d8590"
overlay0 = "#6e7681"
overlay1 = "#8b949e"
mauve = "#bc8cff"
green = "#3fb950"
yellow = "#d29922"
red = "#ff7b72"
blue = "#58a6ff"
teal = "#39c5cf"
peach = "#ffa657"
panel_bg = "#0d1117"
sidebar_bg = "#010409"
active_row_bg = "#161b22"
selection_bg = "#1f6feb"
surface0 = "#161b22"
surface1 = "#30363d"
surface_dim = "#010409"

[theme.custom.light]
accent = "#0969da"
text = "#1f2328"
subtext0 = "#656d76"
overlay0 = "#6e7781"
overlay1 = "#57606a"
mauve = "#8250df"
green = "#1a7f37"
yellow = "#9a6700"
red = "#cf222e"
blue = "#0969da"
teal = "#1b7c83"
peach = "#953800"
panel_bg = "#ffffff"
sidebar_bg = "#f6f8fa"
active_row_bg = "#f6f8fa"
selection_bg = "#ddf4ff"
surface0 = "#f6f8fa"
surface1 = "#eaeef2"
surface_dim = "#f6f8fa"

[terminal]
new_cwd = "follow"
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = "prefix+ctrl+r"
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "yellow"
pane_borders = true
pane_gaps = false
pane_scrollbars = false
confirm_close = false
prompt_new_tab_name = false
mouse_capture = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
