onboarding = false

# Retain Omarchy's tmux-compatible interaction model.
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane
# Nord dark and a Snow Storm light adaptation follow terminal appearance.
# Palette: https://www.nordtheme.com/docs/colors-and-palettes/
# Light text accents are darkened for contrast.
[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom]
accent = "#88c0d0"
text = "#d8dee9"
subtext0 = "#a5abb6"
overlay0 = "#8892a5"
overlay1 = "#a5abb6"
mauve = "#b48ead"
green = "#a3be8c"
yellow = "#ebcb8b"
red = "#bf616a"
blue = "#81a1c1"
teal = "#8fbcbb"
peach = "#d08770"
panel_bg = "#2e3440"
sidebar_bg = "#2e3440"
active_row_bg = "#3b4252"
selection_bg = "#434c5e"
surface0 = "#3b4252"
surface1 = "#434c5e"
surface_dim = "#2e3440"

[theme.custom.light]
accent = "#386575"
text = "#2e3440"
subtext0 = "#4c566a"
overlay0 = "#4c566a"
overlay1 = "#434c5e"
mauve = "#795573"
green = "#50683c"
yellow = "#765b25"
red = "#993f48"
blue = "#3b5e81"
teal = "#3f6262"
peach = "#8a5038"
panel_bg = "#eceff4"
sidebar_bg = "#e5e9f0"
active_row_bg = "#e5e9f0"
selection_bg = "#d8dee9"
surface0 = "#e5e9f0"
surface1 = "#d8dee9"
surface_dim = "#e5e9f0"

[terminal]
new_cwd = "follow"
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = "prefix+ctrl+r"
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
accent = "teal"
pane_borders = true
pane_gaps = false
pane_scrollbars = false
confirm_close = false
prompt_new_tab_name = false
mouse_capture = true
agent_panel_sort = "spaces"

# Pi session names are temporary pane metadata, not persistent tab labels.
[ui.sidebar.agents.rows_by_agent]
pi = [["state_icon", "machine", "workspace", "tab"], ["agent", "pane"]]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
