onboarding = false

# GitHub default palettes; mode overrides follow the host terminal appearance.
# Source: primer/github-vscode-theme and @primer/primitives 7.10.0.
[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom]
accent = "#2f81f7"
text = "#e6edf3"
subtext0 = "#7d8590"
overlay0 = "#6e7681"
overlay1 = "#8b949e"
mauve = "#bc8cff"
green = "#3fb950"
yellow = "#d29922"
red = "#ff7b72"
blue = "#58a6ff"
teal = "#39c5cf"
peach = "#ffa657"
panel_bg = "#0d1117"
sidebar_bg = "#010409"
active_row_bg = "#161b22"
selection_bg = "#1f6feb"
surface0 = "#161b22"
surface1 = "#30363d"
surface_dim = "#010409"

[theme.custom.light]
accent = "#0969da"
text = "#1f2328"
subtext0 = "#656d76"
overlay0 = "#6e7781"
overlay1 = "#57606a"
mauve = "#8250df"
green = "#1a7f37"
yellow = "#9a6700"
red = "#cf222e"
blue = "#0969da"
teal = "#1b7c83"
peach = "#953800"
panel_bg = "#ffffff"
sidebar_bg = "#f6f8fa"
active_row_bg = "#f6f8fa"
selection_bg = "#ddf4ff"
surface0 = "#f6f8fa"
surface1 = "#eaeef2"
surface_dim = "#f6f8fa"

[terminal]
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"
reload_config = "prefix+shift+r"
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+n"
previous_workspace = "ctrl+shift+tab"
next_workspace = "ctrl+tab"
new_tab = "prefix+t"
previous_tab = "ctrl+alt+shift+tab"
next_tab = "ctrl+alt+tab"
switch_tab = "alt+1..9"
switch_workspace = "ctrl+shift+1..9"
close_tab = "prefix+shift+w"
cycle_pane_next = "prefix+u"
cycle_pane_previous = "prefix+i"

[ui]
agent_panel_sort = "spaces"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
pane_history = false
