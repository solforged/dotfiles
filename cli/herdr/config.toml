onboarding = false

[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

# Inherit Ghostty's active Reticle ANSI palette.
[theme.custom]
accent = "yellow"
panel_bg = "reset"
surface0 = "black"
surface1 = "darkgray"
surface_dim = "black"
overlay0 = "gray"
overlay1 = "white"
text = "reset"
subtext0 = "gray"
mauve = "magenta"
green = "reset"
yellow = "yellow"
red = "red"
blue = "cyan"
teal = "cyan"
peach = "lightblue"

[terminal]
default_shell = "zsh"
shell_mode = "auto"

[keys]
reload_config = "prefix+shift+r"
previous_workspace = "ctrl+alt+["
next_workspace = "ctrl+alt+]"
switch_workspace = "prefix+shift+1..9"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
pane_history = false
