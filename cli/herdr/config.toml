onboarding = false

[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

# Inherit Ghostty's active Reticle ANSI palette.
[theme.custom]
accent = "yellow"
panel_bg = "reset"
surface0 = "black"
surface1 = "darkgray"
surface_dim = "black"
overlay0 = "gray"
overlay1 = "white"
text = "reset"
subtext0 = "gray"
mauve = "magenta"
green = "reset"
yellow = "yellow"
red = "red"
blue = "cyan"
teal = "cyan"
peach = "lightblue"

[terminal]
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"
reload_config = "prefix+shift+r"

# Tabs: browser-style cycle (ghostty already emits these as CSI-u).
new_tab = "prefix+t"
close_tab = "prefix+shift+w"
previous_tab = ["ctrl+shift+tab", "prefix+p"]
next_tab = ["ctrl+tab", "prefix+n"]
switch_tab = ["alt+1..9", "prefix+1..9"]

# Workspaces: one modifier family up from tabs + numbered jumps.
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+n"
previous_workspace = "ctrl+alt+shift+tab"
next_workspace = "ctrl+alt+tab"
switch_workspace = "ctrl+shift+1..9"

cycle_pane_next = "prefix+u"
cycle_pane_previous = "prefix+i"

[ui]
agent_panel_sort = "spaces"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
pane_history = false
