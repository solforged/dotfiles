onboarding = false

# Nord dark and a Snow Storm light adaptation follow terminal appearance.
# Palette: https://www.nordtheme.com/docs/colors-and-palettes/
# Light text accents are darkened for contrast.
[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom]
accent = "#88c0d0"
text = "#d8dee9"
subtext0 = "#a5abb6"
overlay0 = "#8892a5"
overlay1 = "#a5abb6"
mauve = "#b48ead"
green = "#a3be8c"
yellow = "#ebcb8b"
red = "#bf616a"
blue = "#81a1c1"
teal = "#8fbcbb"
peach = "#d08770"
panel_bg = "#2e3440"
sidebar_bg = "#2e3440"
active_row_bg = "#3b4252"
selection_bg = "#434c5e"
surface0 = "#3b4252"
surface1 = "#434c5e"
surface_dim = "#2e3440"

[theme.custom.light]
accent = "#386575"
text = "#2e3440"
subtext0 = "#4c566a"
overlay0 = "#4c566a"
overlay1 = "#434c5e"
mauve = "#795573"
green = "#50683c"
yellow = "#765b25"
red = "#993f48"
blue = "#3b5e81"
teal = "#3f6262"
peach = "#8a5038"
panel_bg = "#eceff4"
sidebar_bg = "#e5e9f0"
active_row_bg = "#e5e9f0"
selection_bg = "#d8dee9"
surface0 = "#e5e9f0"
surface1 = "#d8dee9"
surface_dim = "#e5e9f0"

[terminal]
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"
reload_config = "prefix+shift+r"
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+n"
previous_workspace = "ctrl+shift+tab"
next_workspace = "ctrl+tab"
new_tab = "prefix+t"
previous_tab = "ctrl+alt+shift+tab"
next_tab = "ctrl+alt+tab"
switch_tab = "alt+1..9"
switch_workspace = "ctrl+shift+1..9"
close_tab = "prefix+shift+w"
cycle_pane_next = "prefix+u"
cycle_pane_previous = "prefix+i"

[ui]
agent_panel_sort = "spaces"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
pane_history = false
