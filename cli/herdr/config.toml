onboarding = false

# BEGIN GENERATED RETICLE THEME
# Generated by desktop/reticle/generate.py; edit palettes.json instead.
[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "catppuccin-latte"

[theme.custom]
accent = "yellow"
text = "reset"
subtext0 = "darkgray"
overlay0 = "white"
overlay1 = "white"
mauve = "magenta"
green = "green"
yellow = "yellow"
red = "red"
blue = "blue"
teal = "cyan"
peach = "yellow"
panel_bg = "reset"
sidebar_bg = "reset"
active_row_bg = "reset"
selection_bg = "reset"
surface0 = "reset"
surface1 = "reset"
surface_dim = "black"

[theme.custom.light]
surface_dim = "#ffffff"
# END GENERATED RETICLE THEME

[terminal]
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"
reload_config = "prefix+shift+r"
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+n"
previous_workspace = "ctrl+shift+tab"
next_workspace = "ctrl+tab"
new_tab = "prefix+t"
previous_tab = "ctrl+alt+shift+tab"
next_tab = "ctrl+alt+tab"
switch_tab = "alt+1..9"
switch_workspace = "ctrl+shift+1..9"
close_tab = "prefix+shift+w"
cycle_pane_next = "prefix+u"
cycle_pane_previous = "prefix+i"

[ui]
agent_panel_sort = "spaces"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
pane_history = false
