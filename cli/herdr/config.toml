onboarding = false

[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

# Inherit Ghostty's active Reticle ANSI palette.
[theme.custom]
accent = "yellow"
panel_bg = "reset"
surface0 = "black"
surface1 = "darkgray"
surface_dim = "black"
overlay0 = "gray"
overlay1 = "white"
text = "reset"
subtext0 = "gray"
mauve = "magenta"
green = "reset"
yellow = "yellow"
red = "red"
blue = "cyan"
teal = "cyan"
peach = "lightblue"

[terminal]
default_shell = "zsh"
shell_mode = "auto"

[keys]
prefix = "ctrl+b"
reload_config = "prefix+shift+r"
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+n"
previous_workspace = "ctrl+shift+tab"
next_workspace = "ctrl+tab"
new_tab = "prefix+t"
previous_tab = "ctrl+alt+shift+tab"
next_tab = "ctrl+alt+tab"
switch_tab = "alt+1..9"
switch_workspace = "ctrl+shift+1..9"
close_tab = "prefix+shift+w"
cycle_pane_next = "prefix+u"
cycle_pane_previous = "prefix+i"

[ui]
agent_panel_sort = "spaces"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
kitty_graphics = true
pane_history = false
