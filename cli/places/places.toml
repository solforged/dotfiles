# Names shared by the shell, prompt, file manager, and workspaces.
[df]
path = "~/src/dotfiles"
env = "DOTFILES_DIR"
description = "Dotfiles"

[an]
path = "~/work/analysis"
description = "Analysis"

[lst]
path = "~/.local/state"
env = "XDG_STATE_HOME"
description = "Local state"

[lsh]
path = "~/.local/share"
env = "XDG_DATA_HOME"
description = "Local data"
