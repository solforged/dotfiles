# Settings shared by personally owned machines. Agents live in their own
# modules (mise.omp.toml, mise.hermes.toml, mise.pi.toml, mise.claude.toml).

[vars]
git_include_personal_globally = true
ssh_auth_sock = "~/.local/state/1password/agent.sock"

[tools]
hey-cli = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }

[dotfiles]
# Retired: the Codex CLI. Remove its prompt link everywhere it was applied.
"~/.codex/AGENTS.md" = { mode = "absent" }
