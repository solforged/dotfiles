# Settings shared by personally owned machines. Agents live in their own
# modules (mise.omp.toml, mise.pi.toml, mise.claude.toml).

[vars]
git_include_personal_globally = true

[tools]
android-cli = "latest"
android-sdk = "latest"
flutter = "latest"
hey-cli = "latest"
jj = "latest"
vale = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }

[tasks."vale:sync"]
description = "Download the Vale packages named in the global .vale.ini"
dir = "{{ env.HOME }}"
run = "vale sync"

[dotfiles]
"~/.config/vale/.vale.ini" = "~/src/dotfiles/cli/vale/vale.ini"
"~/.local/share/vale/styles/Voice" = { source = "~/src/dotfiles/cli/vale/styles/Voice", mode = "symlink-each" }
# Retired: the Codex CLI. Remove its prompt link everywhere it was applied.
"~/.codex/AGENTS.md" = { mode = "absent" }
