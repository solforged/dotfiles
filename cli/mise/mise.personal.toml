[vars]
git_include_personal_globally = true
ssh_auth_sock = "~/.local/state/1password/agent.sock"

[tools]
"aqua:openai/codex" = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:pmdroid/acpbot" = "latest"
pi = "latest"

[dotfiles]
"~/.codex/AGENTS.md" = "~/src/dotfiles/agents/omp/AGENTS.md"
"~/.omp/agent/config.yml" = "~/src/dotfiles/agents/omp/config.yml"
"~/.omp/agent/models.yml" = "~/src/dotfiles/agents/omp/models.yml"
"~/.omp/agent/AGENTS.md" = "~/src/dotfiles/agents/omp/AGENTS.md"
"~/.omp/agent/TITLE_SYSTEM.md" = "~/src/dotfiles/agents/omp/TITLE_SYSTEM.md"
"~/.omp/agent/APPEND_SYSTEM.md" = "~/src/dotfiles/agents/omp/APPEND_SYSTEM.md"
"~/.omp/agent/themes" = { source = "~/src/dotfiles/agents/omp/themes", mode = "symlink-each" }
"~/.omp/agent/commands" = { source = "~/src/dotfiles/agents/omp/commands", mode = "symlink-each" }
"~/.hermes/config.yaml" = "~/src/dotfiles/agents/hermes/config.yaml"
"~/.hermes/SOUL.md" = "~/src/dotfiles/agents/hermes/SOUL.md"
"~/.hermes/.env" = { source = "~/src/dotfiles/agents/hermes/.env.tmpl", mode = "template" }
"~/.hermes/auth.json" = { source = "~/src/dotfiles/agents/hermes/auth.json.tmpl", mode = "template" }
"~/.config/acpbot/config.toml" = { source = "~/src/dotfiles/agents/acpbot/config.toml.tmpl", mode = "template" }
