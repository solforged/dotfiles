[vars]
git_include_personal_globally = true
ssh_auth_sock = "~/.local/state/1password/agent.sock"

[tools]
"aqua:openai/codex" = "latest"
"github:can1357/oh-my-pi" = "latest"

[dotfiles]
"~/.codex/AGENTS.md" = "~/src/dotfiles/agents/omp/AGENTS.md"
"~/.omp/agent/config.yml" = "~/src/dotfiles/agents/omp/config.yml"
"~/.omp/agent/AGENTS.md" = "~/src/dotfiles/agents/omp/AGENTS.md"
"~/.omp/agent/themes" = { source = "~/src/dotfiles/agents/omp/themes", mode = "symlink-each" }
"~/.omp/agent/commands" = { source = "~/src/dotfiles/agents/omp/commands", mode = "symlink-each" }
