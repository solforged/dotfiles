# Hyperion-specific macOS desktop applications, packages, tools, and services.

[bootstrap.packages]
"brew:chromaprint" = "latest"
"brew:rsync" = "latest"
"brew:summarize" = "latest"
"brew:task" = "latest" # Taskwarrior, not the Go Task runner.
"brew:tig" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:appcleaner" = "latest"
"brew-cask:bit-slicer" = "latest"
"brew-cask:brave-browser" = "latest"
"brew-cask:calibre" = "latest"
"brew-cask:cmux" = "latest"
"brew-cask:codex-app" = "latest"
"brew-cask:crossover" = "latest"
"brew-cask:cryptomator" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:iina" = "latest"
"brew-cask:proton-pass" = "latest"
"brew-cask:remnote" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:telegram" = "latest"
"brew-cask:transmission" = "latest"
"brew-cask:yubico-authenticator" = "latest"
"brew-cask:zed" = "latest"
"brew-cask:zotero" = "latest"

[tools]
"pipx:beets" = { version = "latest", extras = "chroma,embedart,fetchart,lastgenre,lyrics" }
"npm:remnote-mcp-server" = "latest"

[dotfiles]
"~/.config/beets" = { source = "~/src/dotfiles/cli/beets", mode = "symlink-each" }

[tasks."remnote:enable"]
description = "Install login LaunchAgent for remnote-mcp-server"
run = [
  "remnote-mcp-server daemon install-launchd",
  "remnote-mcp-server daemon status",
]

[tasks."remnote:status"]
description = "Check daemon and RemNote bridge connectivity"
run = "remnote-cli status --text"

[tasks."remnote:disable"]
description = "Stop and uninstall remnote-mcp-server LaunchAgent"
run = [
  "remnote-mcp-server daemon stop || true",
  "remnote-mcp-server daemon uninstall-launchd || true",
]
