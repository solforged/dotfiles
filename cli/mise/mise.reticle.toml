# Reticle and Polyimide themes from github.com/solforged/reticle. Add "reticle"
# to a host's modules in miserc.toml.tmpl to clone the ports and link them beside
# the Nord defaults, which stay selected. Omarchy variants install separately
# with `omarchy theme install`; the Reticle README lists their URLs.

[bootstrap.repos]
"~/src/reticle" = { url = "git@github.com:solforged/reticle.git" }

# Per-file wildcards: the base, omp, and editor entries own these directories
# with symlink-each, and a second entry for the same target would replace them.
[dotfiles]
"~/.config/ghostty/themes/*-GH" = "~/src/reticle/ghostty/*-GH"
"~/.omp/agent/themes/*.json" = "~/src/reticle/omp/*.json"
"~/.config/helix/themes/*.toml" = "~/src/reticle/helix/*.toml"
"~/.config/nushell/themes/*.json" = "~/src/reticle/nushell/*.json"
"~/.config/nvim/colors/*.lua" = "~/src/reticle/nvim/colors/*.lua"
"~/.config/nvim/lua/reticle/*.lua" = "~/src/reticle/nvim/lua/reticle/*.lua"
