# Amarna runs Omarchy, which owns the desktop and base system. Declare only
# dependencies required by the portable dotfiles layered over its defaults.

[tasks."moshi:hook"]
# binary, pairing, and agent hooks only. `service install` writes
# ~/.config/systemd/user/moshi-hook.service and fights
# [bootstrap.linux.systemd.units.moshi-hook] for the same socket.
description = "Install, pair, and configure the Moshi agent hook"
dir = "{{ env.HOME }}"
run = '''
set -eu

: "${MOSHI_PAIRING_TOKEN:?set MOSHI_PAIRING_TOKEN to the token from Moshi Settings → Hooks}"

installer="$(mktemp "${TMPDIR:-/tmp}/moshi-hook-install.XXXXXX")"
trap 'rm -f "$installer"' EXIT HUP INT TERM

curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
  https://getmoshi.app/install.sh --output "$installer"
/bin/sh "$installer"

"$HOME/.local/bin/moshi-hook" pair --token "$MOSHI_PAIRING_TOKEN"
"$HOME/.local/bin/moshi-hook" install
if [ -e "$HOME/.config/systemd/user/moshi-hook.service" ]; then
  "$HOME/.local/bin/moshi-hook" service uninstall
fi
'''

[tasks."qwen:install"]
description = "install qwen's vllm runtime"
run = "uv tool install --force --python 3.12 --torch-backend=cu130 'vllm>=0.19.0'"

[tasks."qwen:serve"]
description = "serve qwen3.8 27b fp8 for local coding"
run = '''
exec vllm serve Qwen/Qwen3.8-27B-FP8 \
  --served-model-name qwen3.8-27b \
  --port 8000 \
  --max-model-len 262144 \
  --kv-cache-dtype fp8 \
  --reasoning-parser qwen3 \
  --enable-auto-tool-choice \
  --tool-call-parser qwen3_coder \
  --language-model-only
'''

[tasks."qwen:expose"]
description = "publish localhost llama-server on the tailnet via Tailscale Serve"
run = "tailscale serve --bg --https=443 http://127.0.0.1:8081"

[bootstrap.packages]
"pacman:task" = "latest"
"pacman:zsh" = "latest"
"pacman:ttf-ibm-plex" = "latest"

[dotfiles]
# Preserve Omarchy's interaction model while layering portable preferences.
"~/.config/fontconfig/conf.d" = { source = "~/src/dotfiles/desktop/fontconfig/conf.d", mode = "symlink-each" }
"~/.config/herdr/config.toml" = "~/src/dotfiles/cli/herdr/config.omarchy.toml"
"~/.config/hypr/*.lua" = "~/src/dotfiles/desktop/omarchy/hypr/*.lua"
"~/.config/omarchy/shell.json" = "~/src/dotfiles/desktop/omarchy/shell.json"
"~/.config/omarchy/plugins/sol.lock" = { source = "~/src/dotfiles/desktop/omarchy/plugins/sol.lock", mode = "symlink-each" }
"~/.config/autostart/1password.desktop" = "~/src/dotfiles/desktop/autostart/1password.desktop"

[bootstrap.user]
login_shell = "/usr/bin/zsh"

# moshi-hook serve owns /run/user/$uid/moshi-hook.sock. a second unit of the
# same binary makes phone approvals miss this host.
[bootstrap.linux.systemd.units.moshi-hook]
description = "Moshi hook daemon"
exec_start = "~/.local/bin/moshi-hook serve"
after = ["network-online.target"]
environment = { PATH = "/usr/local/bin:/usr/bin:/bin" }
working_directory = "~"
restart = "on-failure"
restart_sec = "5s"

# Two llama-server windows over one Qwen3.8 27B Q8 MTP blob. Both fit the GPU
# together (~33GB + ~45GB); do not also start `ollama serve`. The 64k unit is
# installed but stays stopped; the 256k unit backs Hermes and the tailnet
# endpoint from `qwen:expose`.
[bootstrap.linux.systemd.units.qwen-mtp]
description = "Qwen3.8 27B Q8 MTP llama-server 64k for OMP"
after = ["network-online.target"]
type = "simple"
exec_start = """\
  /usr/lib/ollama/llama-server \
  --model {{ env.HOME }}/.ollama/models/blobs/sha256-31756fca94beca71ea4b8706d6fdc896dab2a3c6376ab0c1863b98512a24f8d6 \
  -ngl 999 -c 65536 -np 1 -fa on --spec-type draft-mtp --spec-draft-n-max 2 \
  --alias qwen38-64k --jinja --reasoning auto --reasoning-format deepseek \
  --reasoning-preserve --host 127.0.0.1 --port 8080 --no-webui --offline"""
environment = { GGML_BACKEND_PATH = "/usr/lib/ollama/cuda_v13/libggml-cuda.so", LD_LIBRARY_PATH = "/usr/lib/ollama:/usr/lib/ollama/cuda_v13", CUDA_VISIBLE_DEVICES = "0" }
restart = "on-failure"
restart_sec = "3"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.qwen-mtp-256k]
description = "Qwen3.8 27B Q8 MTP llama-server 256k for OMP"
after = ["network-online.target", "dev.mise.qwen-mtp.service"]
type = "simple"
exec_start = """\
  /usr/lib/ollama/llama-server \
  --model {{ env.HOME }}/.ollama/models/blobs/sha256-31756fca94beca71ea4b8706d6fdc896dab2a3c6376ab0c1863b98512a24f8d6 \
  -ngl 999 -c 262144 -np 1 -fa on --spec-type draft-mtp --spec-draft-n-max 2 \
  --alias qwen38-256k --jinja --reasoning auto --reasoning-format deepseek \
  --reasoning-preserve --host 127.0.0.1 --port 8081 --no-webui --offline"""
environment = { GGML_BACKEND_PATH = "/usr/lib/ollama/cuda_v13/libggml-cuda.so", LD_LIBRARY_PATH = "/usr/lib/ollama:/usr/lib/ollama/cuda_v13", CUDA_VISIBLE_DEVICES = "0" }
restart = "on-failure"
restart_sec = "3"

# Replaces voxtype-bin's packaged voxtype.service, which adds -q and orders
# after PipeWire and ydotool. Running `voxtype setup systemd` again would
# write a second unit and start a second daemon.
[bootstrap.linux.systemd.units.voxtype]
description = "Voxtype push-to-talk voice-to-text daemon"
part_of = ["graphical-session.target"]
after = ["graphical-session.target"]
type = "simple"
exec_start = "/usr/bin/voxtype daemon"
environment = { XDG_RUNTIME_DIR = "%t" }
restart = "on-failure"
restart_sec = "5"
wanted_by = ["graphical-session.target"]

[vars]
ssh_key = "~/.ssh/id_ed25519"

[tools]
"pipx:streamrip" = "latest"
