# Amarna runs Omarchy, which owns the desktop and base system. Declare only
# dependencies required by the portable dotfiles layered over its defaults.

[tasks."moshi:hook"]
# binary, pairing, and agent hooks only. `service install` writes
# ~/.config/systemd/user/moshi-hook.service and fights
# [bootstrap.linux.systemd.units.moshi-hook] for the same socket.
description = "Install, pair, and configure the Moshi agent hook"
dir = "{{ env.HOME }}"
run = '''
set -eu

: "${MOSHI_PAIRING_TOKEN:?set MOSHI_PAIRING_TOKEN to the token from Moshi Settings → Hooks}"

installer="$(mktemp "${TMPDIR:-/tmp}/moshi-hook-install.XXXXXX")"
trap 'rm -f "$installer"' EXIT HUP INT TERM

curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
  https://getmoshi.app/install.sh --output "$installer"
/bin/sh "$installer"

"$HOME/.local/bin/moshi-hook" pair --token "$MOSHI_PAIRING_TOKEN"
"$HOME/.local/bin/moshi-hook" install
if [ -e "$HOME/.config/systemd/user/moshi-hook.service" ]; then
  "$HOME/.local/bin/moshi-hook" service uninstall
fi
'''

[tasks."qwen:install"]
description = "install qwen's vllm runtime"
run = "uv tool install --force --python 3.12 --torch-backend=cu130 'vllm>=0.19.0'"

[tasks."qwen:serve"]
description = "serve qwen3.8 27b fp8 for local coding"
run = '''
exec vllm serve Qwen/Qwen3.8-27B-FP8 \
  --served-model-name qwen3.8-27b \
  --port 8000 \
  --max-model-len 262144 \
  --kv-cache-dtype fp8 \
  --reasoning-parser qwen3 \
  --enable-auto-tool-choice \
  --tool-call-parser qwen3_coder \
  --language-model-only
'''

[bootstrap.packages]
"pacman:chromaprint" = "latest"
"pacman:task" = "latest"
"pacman:zsh" = "latest"

[dotfiles]
# Preserve Omarchy's interaction model while layering portable preferences.
"~/.config/beets" = { source = "~/src/dotfiles/cli/beets/", mode = "symlink-each" }
"~/.config/herdr" = { source = "~/src/dotfiles/desktop/omarchy/herdr", mode = "symlink-each" }
"~/.config/hypr/bindings.lua" = { source = "~/src/dotfiles/desktop/omarchy/hypr/bindings.lua", mode = "symlink" }
"~/.config/hypr/input.lua" = { source = "~/src/dotfiles/desktop/omarchy/hypr/input.lua", mode = "symlink" }
"~/.config/hypr/looknfeel.lua" = { source = "~/src/dotfiles/desktop/omarchy/hypr/looknfeel.lua", mode = "symlink" }
"~/.config/hypr/monitors.lua" = { source = "~/src/dotfiles/desktop/omarchy/hypr/monitors.lua", mode = "symlink" }
"~/.config/omarchy/shell.json" = { source = "~/src/dotfiles/desktop/omarchy/shell.json", mode = "symlink" }
"~/.config/omarchy/plugins/sol.lock" = { source = "~/src/dotfiles/desktop/omarchy/plugins/sol.lock", mode = "symlink-each" }
"~/.config/autostart/1password.desktop" = { source = "~/src/dotfiles/desktop/omarchy/autostart/1password.desktop", mode = "symlink" }
"~/.config/omarchy/themes/reticle-dark" = { source = "~/src/dotfiles/desktop/omarchy/themes/reticle-dark", mode = "symlink-each" }
"~/.config/omarchy/themes/reticle-light" = { source = "~/src/dotfiles/desktop/omarchy/themes/reticle-light", mode = "symlink-each" }
"~/.config/starship.toml" = { source = "~/src/dotfiles/desktop/omarchy/starship.toml", mode = "symlink" }

[bootstrap.user]
login_shell = "/usr/bin/zsh"

# moshi-hook serve owns /run/user/$uid/moshi-hook.sock. a second unit of the
# same binary makes phone approvals miss this host.
[bootstrap.linux.systemd.units.moshi-hook]
description = "Moshi hook daemon"
exec_start = "~/.local/bin/moshi-hook serve"
after = ["network-online.target"]
environment = { PATH = "/usr/local/bin:/usr/bin:/bin" }
working_directory = "~"
restart = "on-failure"
restart_sec = "5s"

[bootstrap.hooks.post-dotfiles]
run = '''
state_home="${XDG_STATE_HOME:-$HOME/.local/state}"
agent_dir="$state_home/1password"

if [ -e "$HOME/.1password" ] && [ ! -L "$HOME/.1password" ]; then
  if [ -e "$agent_dir" ]; then
    printf '%s\n' "1Password agent migration: both $HOME/.1password and $agent_dir exist" >&2
    exit 1
  fi
  mkdir -p "$state_home"
  mv "$HOME/.1password" "$agent_dir"
fi

mkdir -p "$agent_dir"
if [ ! -e "$HOME/.1password" ] && [ ! -L "$HOME/.1password" ]; then
  ln -s "$agent_dir" "$HOME/.1password"
fi
'''

[vars]
git_signing_program = "/opt/1Password/op-ssh-sign"
onepassword_agent_sock = "~/.local/state/1password/agent.sock"
ssh_auth_sock = "~/.local/state/1password/agent.sock"

[tools]
"pipx:beets" = { version = "latest", extras = "chroma,embedart,fetchart,lastgenre,lyrics" }
"pipx:streamrip" = "latest"
