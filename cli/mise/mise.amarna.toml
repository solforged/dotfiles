[dotfiles]
# Preserve Omarchy's interaction model while layering portable preferences.
"~/.config/fontconfig/conf.d" = { source = "~/src/dotfiles/desktop/fontconfig/conf.d", mode = "symlink-each" }
"~/.config/herdr/config.toml" = "~/src/dotfiles/cli/herdr/config.omarchy.toml"
"~/.config/hypr/*.lua" = "~/src/dotfiles/desktop/omarchy/hypr/*.lua"
"~/.config/omarchy/shell.json" = "~/src/dotfiles/desktop/omarchy/shell.json"
"~/.config/omarchy/plugins/sol.lock" = { source = "~/src/dotfiles/desktop/omarchy/plugins/sol.lock", mode = "symlink-each" }
"~/.config/autostart/1password.desktop" = "~/src/dotfiles/desktop/autostart/1password.desktop"
"~/.local/bin/media-import" = "~/src/dotfiles/cli/bin/media-import"
# Runs Obsidian on electron43 instead of the package's default Electron.
"~/.local/bin/obsidian" = "~/src/dotfiles/desktop/omarchy/bin/obsidian"
# The installer's paths, for the unit below and non-login SSH sessions from
# the Moshi app, which do not see mise shims.
"~/.local/bin/moshi-hook" = "~/.local/share/mise/shims/moshi-hook"
"~/.local/bin/moshi" = "~/.local/share/mise/shims/moshi"
# Apps rewrite these files, so merge owns only the keys in each source.
"~/.config/opencode/opencode.json/shared" = { source = "~/src/dotfiles/agents/opencode/opencode.json", merge = true }
"~/.config/opencode/tui.json/shared" = { source = "~/src/dotfiles/agents/opencode/tui.json", merge = true }
"~/.config/moshi/config.toml/shared" = { source = "~/src/dotfiles/cli/moshi/config.toml", merge = true }
"~/.config/voxtype/config.toml/shared" = { source = "~/src/dotfiles/desktop/voxtype/config.toml", merge = true }
"~/.config/streamrip/config.toml/shared" = { source = "~/src/dotfiles/cli/streamrip/config.toml", merge = true }
"~/.config/tern/settings.json/shared" = { source = "~/src/dotfiles/desktop/tern/settings.json", merge = true }
# xdg-mime and xdg-user-dirs-update rewrite these; `mise dot add --changed`
# captures their edits.
"~/.config/mimeapps.list" = { source = "~/src/dotfiles/desktop/omarchy/mimeapps.list", mode = "copy" }
"~/.config/user-dirs.dirs" = { source = "~/src/dotfiles/desktop/omarchy/user-dirs.dirs", mode = "copy" }
# Solforge Omarchy themes and Tunon Hermes skin, from the clone made by
# mise.solforge.toml.
"~/.config/omarchy/themes/solforge-dark" = "~/src/solforge-theme/omarchy-solforge-dark-theme"
"~/.config/omarchy/themes/solforge-light" = "~/src/solforge-theme/omarchy-solforge-light-theme"
"~/.hermes/skins/tunon.yaml" = "~/src/solforge-theme/hermes/tunon.yaml"

[bootstrap.user]
login_shell = "/usr/bin/zsh"

# moshi-hook serve owns /run/user/$uid/moshi-hook.sock. a second unit of the
# same binary makes phone approvals miss this host.
[bootstrap.linux.systemd.units.moshi-hook]
description = "Moshi hook daemon"
exec_start = "~/.local/bin/moshi-hook serve"
after = ["network-online.target"]
environment = { PATH = "/usr/local/bin:/usr/bin:/bin" }
working_directory = "~"
restart = "on-failure"
restart_sec = "5s"

# Two llama-server windows over one Qwen3.8 27B Q8 MTP blob. Both fit the GPU
# together (~33GB + ~45GB); do not also start `ollama serve`. The 64k unit is
# installed but stays stopped; the 256k unit backs Hermes and the tailnet
# endpoint from `qwen:expose`.
[bootstrap.linux.systemd.units.qwen-mtp]
description = "Qwen3.8 27B Q8 MTP llama-server 64k for OMP"
after = ["network-online.target"]
type = "simple"
exec_start = """\
  /usr/lib/ollama/llama-server \
  --model {{ env.HOME }}/.ollama/models/blobs/sha256-31756fca94beca71ea4b8706d6fdc896dab2a3c6376ab0c1863b98512a24f8d6 \
  -ngl 999 -c 65536 -np 1 -fa on --spec-type draft-mtp --spec-draft-n-max 2 \
  --alias qwen38-64k --jinja --reasoning auto --reasoning-format deepseek \
  --reasoning-preserve --host 127.0.0.1 --port 8080 --no-webui --offline"""
environment = { GGML_BACKEND_PATH = "/usr/lib/ollama/cuda_v13/libggml-cuda.so", LD_LIBRARY_PATH = "/usr/lib/ollama:/usr/lib/ollama/cuda_v13", CUDA_VISIBLE_DEVICES = "0" }
restart = "on-failure"
restart_sec = "3"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.qwen-mtp-256k]
description = "Qwen3.8 27B Q8 MTP llama-server 256k for OMP"
after = ["network-online.target", "dev.mise.qwen-mtp.service"]
type = "simple"
exec_start = """\
  /usr/lib/ollama/llama-server \
  --model {{ env.HOME }}/.ollama/models/blobs/sha256-31756fca94beca71ea4b8706d6fdc896dab2a3c6376ab0c1863b98512a24f8d6 \
  -ngl 999 -c 262144 -np 1 -fa on --spec-type draft-mtp --spec-draft-n-max 2 \
  --alias qwen38-256k --jinja --reasoning auto --reasoning-format deepseek \
  --reasoning-preserve --host 127.0.0.1 --port 8081 --no-webui --offline"""
environment = { GGML_BACKEND_PATH = "/usr/lib/ollama/cuda_v13/libggml-cuda.so", LD_LIBRARY_PATH = "/usr/lib/ollama:/usr/lib/ollama/cuda_v13", CUDA_VISIBLE_DEVICES = "0" }
restart = "on-failure"
restart_sec = "3"

# Replaces voxtype-bin's packaged voxtype.service, which adds -q and orders
# after PipeWire and ydotool. Running `voxtype setup systemd` again would
# write a second unit and start a second daemon.
[bootstrap.linux.systemd.units.voxtype]
description = "Voxtype push-to-talk voice-to-text daemon"
part_of = ["graphical-session.target"]
after = ["graphical-session.target"]
type = "simple"
exec_start = "/usr/bin/voxtype daemon"
environment = { XDG_RUNTIME_DIR = "%t" }
restart = "on-failure"
restart_sec = "5"
wanted_by = ["graphical-session.target"]

[vars]
ssh_key = "~/.ssh/id_ed25519"

[tools]
"pipx:streamrip" = "latest"
"pipx:trafilatura" = "latest"
# vLLM's CUDA 13 torch comes from PyTorch's index, which uv picks with this.
"pipx:vllm" = { version = "latest", python = "3.12", install_env = { UV_TORCH_BACKEND = "cu130" } }
# Every cua-driver release is a GitHub prerelease in the trycua monorepo;
# `cua-driver update` still calls the newest one stable.
"github:trycua/cua" = { version = "latest", version_prefix = "cua-driver-rs-v", prerelease = true, asset_pattern = "cua-driver-rs-*-linux-x86_64-binary.tar.gz" }
cmake = "latest"
ninja = "latest"
lazydocker = "latest"

# The CDN keeps only the current release, so older pins stop resolving.
[tools."http:moshi-hook"]
version = "latest"
url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Linux_x86_64.tar.gz"
checksum_url = "https://cdn.getmoshi.app/hook/v{{ version }}/checksums.txt"
version_list_url = "https://cdn.getmoshi.app/hook/latest/version.txt"
postinstall = 'ln -sfn moshi-hook "$MISE_TOOL_INSTALL_PATH/moshi"'
