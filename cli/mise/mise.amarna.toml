# Amarna runs Omarchy, which owns the desktop and base system. Declare only
# dependencies required by the portable dotfiles layered over its defaults.

[tasks."moshi:hook"]
# Pairing and agent hooks only; the binary is the http:moshi-hook tool. Hook
# files record its versioned install path, so run this again after upgrading
# moshi-hook, when `moshi-hook doctor` reports hooks out of date.
# `service install` writes ~/.config/systemd/user/moshi-hook.service and fights
# [bootstrap.linux.systemd.units.moshi-hook] for the same socket.
description = "Pair and configure the Moshi agent hook"
dir = "{{ env.HOME }}"
run = '''
set -eu

hook="$HOME/.local/bin/moshi-hook"
# Pair only on a new host: export the token from Moshi Settings → Hooks.
if [ -n "${MOSHI_PAIRING_TOKEN:-}" ]; then
  "$hook" pair --token "$MOSHI_PAIRING_TOKEN"
fi
"$hook" install
if [ -e "$HOME/.config/systemd/user/moshi-hook.service" ]; then
  "$hook" service uninstall
fi
'''

[tasks."qwen:serve"]
description = "serve qwen3.8 27b fp8 for local coding"
run = '''
exec vllm serve Qwen/Qwen3.8-27B-FP8 \
  --served-model-name qwen3.8-27b \
  --port 8000 \
  --max-model-len 262144 \
  --kv-cache-dtype fp8 \
  --reasoning-parser qwen3 \
  --enable-auto-tool-choice \
  --tool-call-parser qwen3_coder \
  --language-model-only
'''

[tasks."qwen:expose"]
description = "publish localhost llama-server on the tailnet via Tailscale Serve"
run = "tailscale serve --bg --https=443 http://127.0.0.1:8081"

